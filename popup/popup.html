<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EchoTranslate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <div class="popup-topbar">
      <div class="brand">
        <img id="brand-icon" src="../icons/icon48.png" width="18" height="18" style="border-radius: 4px; display: block;" alt="icon">
        <span class="brand-name">EchoTranslate</span>
        <span id="status-indicator" class="status-dot offline" title="AI 本地服务检测中..."></span>
      </div>
      <button id="btn-options" class="icon-btn" title="设置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.09-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>

    <!-- 谷歌翻译双分段语言按钮 -->
    <div class="lang-selector">
      <button id="btn-orig-lang" class="lang-tab active" title="点击还原页面原文">
        <span class="tab-label">检测到的语言 (英文)</span>
      </button>
      <button id="btn-target-lang" class="lang-tab" title="点击将页面翻译为中文">
        <span class="tab-label">中文 (简体)</span>
      </button>
    </div>

    <!-- 进度与状态提示 -->
    <div class="progress-wrap">
      <div id="progress-bar" class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="status-text" class="status-text">原文</div>
    </div>

    <!-- 辅助选项：双语对照与自动翻译切换 -->
    <div class="popup-bottom">
      <label class="toggle-wrap" title="勾选后在原文下方展示译文；未勾选则直接替换为中文">
        <input type="checkbox" id="chk-bilingual">
        <span class="toggle-slider"></span>
        <span class="toggle-text">双语对照</span>
      </label>
      <label class="toggle-wrap" title="打开英文网页时自动检测并开启翻译">
        <input type="checkbox" id="chk-auto-translate">
        <span class="toggle-slider"></span>
        <span class="toggle-text">自动翻译英文</span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
